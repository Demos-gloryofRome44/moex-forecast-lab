server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SSE: без буферизации и с длинным таймаутом, иначе события будут приходить пачками или рваться.
    location = /api/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: любой неизвестный путь отдаёт index.html, маршрутизирует Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 7d;
        access_log off;
    }
}
